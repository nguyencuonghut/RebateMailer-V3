; ─── PHP Production Settings for RebateMailer-V3 ────────────────────────────

; Error handling
display_errors       = Off
display_startup_errors = Off
log_errors           = On
error_log            = /var/www/html/storage/logs/php.log
error_reporting      = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Memory & execution limits
memory_limit         = 256M
max_execution_time   = 300
max_input_time       = 300
max_input_vars       = 3000

; File upload
upload_max_filesize  = 50M
post_max_size        = 55M

; Date
date.timezone        = Asia/Ho_Chi_Minh

; Session
session.gc_maxlifetime = 7200
session.cookie_secure  = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; Character encoding
default_charset      = UTF-8
mbstring.language    = Vietnamese
mbstring.internal_encoding = UTF-8

; ─── OPcache (critical for production performance) ────────────────────────────
[opcache]
opcache.enable                 = 1
opcache.enable_cli             = 0
opcache.memory_consumption     = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files  = 20000
opcache.max_wasted_percentage  = 10
opcache.validate_timestamps    = 0
opcache.revalidate_freq        = 0
opcache.fast_shutdown          = 1
opcache.save_comments          = 1
opcache.huge_code_pages        = 0

; ─── Realpath cache (faster file lookups) ─────────────────────────────────────
realpath_cache_size  = 4096K
realpath_cache_ttl   = 600
