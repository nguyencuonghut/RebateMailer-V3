gzip              on;
gzip_comp_level   5;
gzip_min_length   256;
gzip_proxied      any;
gzip_vary         on;
gzip_types
    application/javascript
    application/json
    application/x-font-ttf
    application/xml
    font/opentype
    image/svg+xml
    text/css
    text/plain
    text/xml;

server {
    listen 80;
    server_name _;

    root  /var/www/html/public;
    index index.php;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"              always;
    add_header X-Content-Type-Options   "nosniff"                 always;
    add_header X-XSS-Protection         "1; mode=block"           always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ── Static assets: long cache, served directly by Nginx ──────────────
    location ~* \.(css|js|woff2?|ttf|otf|eot|ico|svg|png|jpg|jpeg|gif|webp|avif)$ {
        expires     1y;
        access_log  off;
        add_header  Cache-Control "public, immutable";
    }

    # ── Vite build manifest & assets: immutable cache ─────────────────────
    location /build/ {
        expires     1y;
        access_log  off;
        add_header  Cache-Control "public, immutable";
    }

    # ── Health check (used by load balancers / monitoring) ────────────────
    location = /up {
        access_log off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Main Laravel router ───────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM proxy ─────────────────────────────────────────────────────
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass             app:9000;
        fastcgi_index            index.php;
        fastcgi_read_timeout     300s;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        # Larger buffers for Inertia / JSON responses
        fastcgi_buffer_size          128k;
        fastcgi_buffers              4 256k;
        fastcgi_busy_buffers_size    256k;
    }

    # ── Block access to dot-files (.env, .git, etc.) ──────────────────────
    location ~ /\. {
        deny all;
    }

    # ── Logging ───────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    client_max_body_size 50M;
}
